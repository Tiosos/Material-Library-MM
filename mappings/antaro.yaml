# Blum TANDEMBOX antaro catalogue -> UMR v2 (catalogue only, no prices)
# Generated by ingest/pdf_antaro.py. Import with --no-price; prices come from a
# separate price list via scripts/import_prices.py (joined on supplier + part no.).
vendor: blum_antaro
source_system: blum_antaro_catalogue

defaults:
  category_code: hardware
  unit: ea
  country: AT
  brand: Blum
  supplier: Blum

extra_headers: attributes

fields:
  - key: part_no
    target: identifier
    kind: supplier_code
    required: true
    aliases: ["Part no.", "Part no", "Part No", "Article no."]

  - key: hardware_type
    target: attribute
    aliases: ["Component", "Component type", "Item"]

  - key: drawer_type
    target: attribute
    aliases: ["Drawer type", "Application", "Drawer"]

  - key: specification
    target: attribute
    aliases: ["Specification", "Size", "Nominal length", "Length"]

  - key: colour
    target: attribute
    aliases: ["Colour", "Color", "Finish"]

  - key: page
    target: attribute
    aliases: ["Page", "Seite", "Catalogue page"]

  - key: system
    target: attribute
    aliases: ["System", "Product system", "Series"]

name_template: "{brand} {hardware_type} {specification} {drawer_type}"
