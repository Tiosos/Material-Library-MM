# =============================================================================
# joineryflow Catalog → UMR mapping spec  v1
#
# Upstream source of truth (read from GitHub Tiosos/joineryflow when writing this file):
#   apps/api/app/catalog/queries.py  :: REGISTRY / *_FIELDS_TUPLE / ENRICHMENT_SELECT
#   db/alembic/versions/0007,0017,0067..0079
#   apps/api/app/catalog/routes.py   :: /catalog/{slug}, /catalog/by-type,
#                                       /catalog/product-types, /catalog/{slug}/{id}/purchase-history
#   seed/hartwood_joinery.py         :: real material samples
#
# Upstream invariants (must be respected, otherwise the mapping will be wrong):
#   * 9 physical tables, never merged → merge into 1 core table in UMR, distinguished by category
#   * Common columns: description / notes / default_supplier(_id) / default_lead_time_days
#     / unit_cost / product_type / synonyms / archived_at,archived_by
#   * Unit price rule: when unit_cost is empty, fall back to each table's own cost column
#       board → cost_per_sheet | hardware → cost | benchtop → cost_per_slab
#       edging/glass/timber/appliance → cost_per_unit | equipment_hire → none
#   * Soft archive only (archived_at), never hard delete
#   * Everything is isolated by workspace_id; anything across workspaces is always 404
# =============================================================================

version: 1
source:
  system: joineryflow
  connection: postgres  # direct connection read; or a /catalog/by-type snapshot exported by joineryflow
  workspace_scope: each workspace is exported as an independent library_namespace, never mixed

# -----------------------------------------------------------------------------
# 1. Tables → category
# -----------------------------------------------------------------------------
tables:
  board_materials:
    category: board
    pk: material_id
    endpoint: /catalog/board-materials
  edging_materials:
    category: edging
    pk: material_id
    endpoint: /catalog/edging-materials
  glass_materials:
    category: glass
    pk: material_id
    endpoint: /catalog/glass-materials
  timber_materials:
    category: timber
    pk: material_id
    endpoint: /catalog/timber-materials
  benchtop_materials:
    category: benchtop
    pk: material_id
    endpoint: /catalog/benchtop-materials
  hardware_materials:
    category: hardware
    pk: material_id
    endpoint: /catalog/hardware-materials
  appliances:
    category: appliance
    pk: material_id
    endpoint: /catalog/appliances
  custom_made:
    category: custom
    pk: material_id
    endpoint: /catalog/custom-made
  equipment_hire:
    category: hire
    pk: hire_id
    endpoint: /catalog/equipment-hire
    note: requires project_id; on export put project_id into attributes, hire records are isolated by project

# Types in joineryflow that "have only a tab and no separate table", keep the tab semantics on import:
tab_only_types: [Delivery, Supplies, Paint, TG Solid, Laminate, Contractor Manufacturing]
tab_only_mapping:
  Laminate:                 { table: board_materials,  force_product_type: Laminate }
  TG Solid:                 { table: benchtop_materials, force_product_type: TG Solid }
  Supplies:                 { table: hardware_materials, force_product_type: Supplies }
  Paint:                    { table: hardware_materials, force_product_type: Paint }
  Delivery:                 { table: custom_made,        force_product_type: Delivery }
  Contractor Manufacturing: { table: custom_made,        force_product_type: Contractor Manufacturing }

# -----------------------------------------------------------------------------
# 2. Common column mapping (shared by the 9 tables)
# -----------------------------------------------------------------------------
common:
  material_uid:     "mat_<ulid>"          # generated on first import, fixed afterwards; also written to identifiers.legacy_id
  category:         "<category from the table above>"
  product_type:     "product_type"        # varchar(64), use the tab_only force_product_type when empty
  name:             "description"         # joineryflow has no separate name column, use description
  description:      "description"
  brand:            "brand | manufacturer | laminate_supplier"   # take the first non-null per table
  lead_time_days:   "default_lead_time_days"
  unit:             "um"
  currency:         "'AUD'"
  cost_basis:       "'ex_gst'"
  unit_cost:        "COALESCE(unit_cost, <own_cost_column>)"     # see own_cost_column
  default_supplier: "default_supplier | supplier | vendor"       # take the first non-null per table
  default_supplier_ref: "default_supplier_id → vendors.name (same-workspace check)"
  product_url:      "product_website"
  image_url:        "image_blob IS NOT NULL → /catalog/{slug}/{id}/image"
  synonyms:         "synonyms (text[])"
  status:           "archived_at IS NOT NULL → 'archived' ELSE 'active'"
  source_system:    "'joineryflow'"
  source_id:        "material_id | hire_id"
  source_payload:   "whole row to_jsonb(row) (excluding image_blob)"
  imported_at:      "now()"
  confidence:       "1.00 (manual import 0.80, CV-matched import 0.60)"

# -----------------------------------------------------------------------------
# 3. Per-table specific fields → attributes (key names stay unchanged, to make two-way write-back easy)
# -----------------------------------------------------------------------------
attributes:
  board:
    colour:        colour
    substrate:     substrate
    finish:        finish
    sided:         sided
    grain:         grain
    rating:        rating
    hmr:           hmr
    sheet_len_mm:  sheet_len_mm
    sheet_wid_mm:  sheet_wid_mm
    thickness_mm:  thickness_mm
    grain_locked:  grain_locked
    own_cost_column: cost_per_sheet
    codes: { code: internal_ref }

  edging:
    colour:            colour
    edge_type:         edge_type
    roll_length_m:     roll_length_m
    edge_width_mm:     edge_width_mm
    edge_thickness_mm: edge_thickness_mm
    glued:             glued
    own_cost_column:   cost_per_unit

  glass:
    colour:          colour
    edge_finish:     edge_finish
    glass_type:      glass_type
    power_point:     power_point
    length_mm:       length_mm
    width_mm:        width_mm
    thickness_mm:    thickness_mm
    shaped:          shaped
    own_cost_column: cost_per_unit

  timber:
    colour:          colour
    finish:          finish
    grain:           grain
    rating:          rating
    thickness_mm:    thickness_mm
    width_mm:        width_mm
    length_mm:       length_mm
    own_cost_column: cost_per_unit

  benchtop:
    colour:            colour
    underside:         underside
    edge_details:      edge_details
    laminate_supplier: laminate_supplier
    laminate_code:     laminate_code
    finish:            finish
    bench_length_mm:   bench_length_mm
    bench_width_mm:    bench_width_mm
    thickness_mm:      thickness_mm
    pieces:            pieces
    joins:             joins
    cable_entry:       cable_entry
    shaped:            shaped
    grain_locked:      grain_locked
    slab_id:           slab_id          # also registered as identifier(kind=slab_id)
    own_cost_column:   cost_per_slab

  hardware:
    brand:           brand
    hardware_type:   hardware_type
    own_cost_column: cost

  appliance:
    model_no:        model_number       # also registered as identifier(kind=model_no)
    own_cost_column: cost_per_unit

  custom:
    internal_ref:    internal_ref       # also registered as identifier(kind=internal_ref)
    vendor:          vendor             # → default_supplier
    own_cost_column: cost

  hire:
    contract_ref:    contract_ref       # also registered as identifier(kind=contract_ref)
    project_id:      project_id
    rate:            rate
    rate_unit:       rate_unit
    own_cost_column: null               # equipment_hire has no cost column

# -----------------------------------------------------------------------------
# 4. identifiers: register the "codes" scattered across tables in one place
# -----------------------------------------------------------------------------
identifiers:
  - kind: sku           value: sku            source_system: joineryflow   is_primary: true
  - kind: internal_ref  value: internal_ref   source_system: joineryflow   # custom_made
  - kind: slab_id       value: slab_id        source_system: joineryflow   # benchtop
  - kind: model_no      value: model_number   source_system: joineryflow   # appliance
  - kind: contract_ref  value: contract_ref   source_system: joineryflow   # hire
  - kind: legacy_id     value: material_id|hire_id  source_system: joineryflow
  - kind: cv_code       value: cv_material_mapping.cv_code  source_system: cv  # supplier CV code

# -----------------------------------------------------------------------------
# 5. Write-back: UMR is the master data, changes must be able to go back to joineryflow
#    Principle: only write back fields joineryflow already has; do not change its table structure
# -----------------------------------------------------------------------------
write_back:
  endpoint: "PATCH /catalog/{slug}/{mid}"
  guarded_by: "catalog:write + workspace check"
  fields:
    description:      name
    product_type:     product_type
    um:               unit
    unit_cost:        unit_cost
    default_lead_time_days: lead_time_days
    product_website:  product_url
    synonyms:         synonyms
  attributes: "flatten back into the same-named columns of each table (board.colour ← attributes.colour …)"
  forbidden:
    - Do not write back archived_at (archiving is a joineryflow business action)
    - Do not change prices already snapshotted on a quote (it would alter the tender amount)
    - Do not delete rows, only soft-archive

# -----------------------------------------------------------------------------
# 6. Incremental sync
# -----------------------------------------------------------------------------
sync:
  pull: "GET /catalog/by-type?q=&updated_since=<ts>  (joineryflow needs an updated_at column;
        degrade to a full comparison of source_payload hashes)"
  push: "PUT /v1/materials/{uid} idempotent; if material_uid already exists, rev +1"
  conflict: "the newer updated_at wins; conflicts go to the material_conflict table for human adjudication, never silently overwritten"
  batch: "1000 rows per batch, one transaction per batch, the whole batch rolls back on failure (following joineryflow's all-or-nothing convention)"

# -----------------------------------------------------------------------------
# 7. Export formats (for other systems to consume)
# -----------------------------------------------------------------------------
export:
  - format: jsonl        file: materials.jsonl      note: one UMR per line, streaming import
  - format: csv          file: materials.csv        note: flat columns + attributes expanded into attr_* columns
  - format: parquet      file: materials.parquet    note: analytics / BI
  - format: json-schema  file: material.schema.json note: contract for consumers to generate clients
  - format: openapi      file: openapi.yaml         note: query and write API
  - format: sql          file: material.sql         note: consumers can create an isomorphic table directly
