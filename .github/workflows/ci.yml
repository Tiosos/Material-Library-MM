name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: English-only and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: No CJK text anywhere in the repository
        run: python scripts/check_english.py

      - name: Python compiles
        run: python -m compileall -q proto ingest scripts api tests

      - name: JSON Schema parses
        run: python -c "import json; json.load(open('schema/material.schema.json', encoding='utf-8'))"

  database:
    name: Schema, demo and import pipeline
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ml
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGDATABASE: ml
      PGPASSWORD: postgres
      ML_DSN: postgresql://postgres:postgres@127.0.0.1:5432/ml
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install importer dependencies
        run: pip install --quiet pyyaml "psycopg[binary]" openpyxl

      - name: Load schema, search functions and reference data
        run: |
          psql -v ON_ERROR_STOP=1 -q \
            -f schema/material.sql -f schema/search.sql -f schema/seed.sql

      - name: Acceptance demo (search levels, units, families, sync, write-back)
        run: psql -v ON_ERROR_STOP=1 -q -f schema/sample_demo.sql

      - name: Search levels are correct
        run: |
          test "$(psql -tAc "SELECT level FROM material_search('LAM-MEL-BLK-18') LIMIT 1")" = "exact"
          test "$(psql -tAc "SELECT level FROM material_search('LAM-MEL') LIMIT 1")" = "prefix"
          test "$(psql -tAc "SELECT level FROM material_search('laminex black') LIMIT 1")" = "and"
          test "$(psql -tAc "SELECT level FROM material_search('laminx') LIMIT 1")" = "fuzzy"
          test "$(psql -tAc "SELECT coalesce((SELECT level FROM material_search('b') LIMIT 1), 'none')")" = "none"

      - name: Import the Blum catalogue extract
        run: |
          python scripts/import_file.py \
            --file ingest/samples/blum_hinges.csv \
            --mapping mappings/blum.yaml \
            --dsn "$ML_DSN" --apply --json /tmp/blum.json
          python - <<'PY'
          import json
          stats = json.load(open("/tmp/blum.json"))["stats"]
          assert stats["new"] == 105, stats
          assert stats["skipped"] == 0, stats
          print("first import:", stats)
          PY

      - name: Re-import is idempotent
        run: |
          python scripts/import_file.py \
            --file ingest/samples/blum_hinges.csv \
            --mapping mappings/blum.yaml \
            --dsn "$ML_DSN" --apply --json /tmp/blum2.json
          python - <<'PY'
          import json
          stats = json.load(open("/tmp/blum2.json"))["stats"]
          assert stats["new"] == 0, stats
          print("second import:", stats)
          PY

      - name: Import a board price list with free-form headers
        run: |
          python scripts/import_file.py \
            --file ingest/samples/laminex_boards.csv \
            --mapping mappings/laminex.yaml \
            --dsn "$ML_DSN" --apply --json /tmp/laminex.json
          python - <<'PY'
          import json
          stats = json.load(open("/tmp/laminex.json"))["stats"]
          assert stats["new"] == 4, stats
          print("laminex import:", stats)
          PY

      - name: Family aggregation groups the three thicknesses as one product
        run: |
          test "$(psql -tAc "SELECT member_count FROM v_family WHERE display_name = 'Laminex Black MDF Melamine'")" = "3"
          test "$(psql -tAc "SELECT min_thickness_mm::int || '-' || max_thickness_mm::int FROM v_family WHERE display_name = 'Laminex Black MDF Melamine'")" = "16-25"

  api:
    name: Read API, contract and search evaluation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
      PYTHONIOENCODING: utf-8
      ML_API_DSN: postgresql://postgres:postgres@127.0.0.1:5432/ml_api
      ML_FIXTURE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/ml_fixture
      ML_BLUM_DSN: postgresql://postgres:postgres@127.0.0.1:5432/ml_blum
      ML_MERGE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/ml_merge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API and test dependencies
        run: pip install --quiet -r api/requirements.txt

      # Three databases on purpose: the evaluation corpus must not leak into the sample
      # catalogue, and the HTTP tests exercise both at once (docs/api-v1.md 9).
      - name: Prepare databases
        run: |
          for db in ml_api ml_fixture ml_blum ml_merge; do
            createdb "$db"
            psql -q -v ON_ERROR_STOP=1 -d "$db"               -f schema/material.sql -f schema/search.sql -f schema/api.sql -f schema/merge.sql               -f schema/seed.sql
          done
          psql -q -v ON_ERROR_STOP=1 -d ml_fixture -f eval/fixture.sql
          psql -q -v ON_ERROR_STOP=1 -d ml_api -f eval/fixture.sql
          psql -q -v ON_ERROR_STOP=1 -d ml_merge -f eval/fixture.sql
          for db in ml_api ml_blum; do
            python scripts/import_file.py --file ingest/samples/blum_hinges.csv               --mapping mappings/blum.yaml --dsn "postgresql://postgres:postgres@127.0.0.1:5432/$db" --apply
            python scripts/import_file.py --file ingest/samples/laminex_boards.csv               --mapping mappings/laminex.yaml --dsn "postgresql://postgres:postgres@127.0.0.1:5432/$db" --apply
          done

      # The read contract runs first: the merge contract mutates pairs, and the HTTP tests
      # create their own probe records (docs/t2-merge.md 10.2).
      - name: SQL contract (payloads, totals, cursor, export)
        run: psql -q -v ON_ERROR_STOP=1 -d ml_api -f scripts/api_contract.sql

      - name: SQL contract (duplicate scan, preview, merge, ignore)
        run: |
          psql -q -v ON_ERROR_STOP=1 -d ml_fixture -f scripts/merge_contract.sql
          psql -q -v ON_ERROR_STOP=1 -d ml_api -f scripts/merge_contract.sql

      # The CLIs are the documented path for environments without HTTP (docs/t2-merge.md 8),
      # so a fixture database drives a real scan, a dry run, a merge and an idempotent retry.
      - name: Duplicate CLI (scan, dry run, merge, retry)
        run: |
          python scripts/duplicate_scan.py --dsn "$ML_MERGE_DSN" --quiet
          python scripts/duplicate_scan.py --dsn "$ML_MERGE_DSN" --json scan.json --quiet
          python scripts/merge_materials.py --dsn "$ML_MERGE_DSN"             --keep mat_FX000000000000000000DXPK01 --merge mat_FX000000000000000000DXPK02             --reason "same board, two imports" --dry-run
          python scripts/merge_materials.py --dsn "$ML_MERGE_DSN"             --keep mat_FX000000000000000000DXPK01 --merge mat_FX000000000000000000DXPK02             --reason "same board, two imports" --json merge.json
          python scripts/merge_materials.py --dsn "$ML_MERGE_DSN"             --keep mat_FX000000000000000000DXPK01 --merge mat_FX000000000000000000DXPK02
          python - <<'PY'
          import json, sys
          scan = json.load(open("scan.json", encoding="utf-8"))
          report = json.load(open("merge.json", encoding="utf-8"))
          assert scan["pairs"] == 1, scan
          assert report["code"] == "merged", report
          assert report["anchors"] == 2, report
          print("CLI contract OK")
          PY

      - name: HTTP smoke tests
        run: python -m pytest -q tests
        env:
          ML_DSN: ${{ env.ML_API_DSN }}

      - name: Search evaluation (fixture corpus)
        run: python scripts/eval_search.py --dsn "$ML_FIXTURE_DSN" --dataset fixture

      - name: Search evaluation (Blum catalogue)
        run: python scripts/eval_search.py --dsn "$ML_BLUM_DSN" --dataset blum
